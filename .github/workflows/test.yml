name: test

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Cancel any older in-progress run on the same ref when a new push lands.
# Implement-pipeline iterates with 1-3 pushes per iter; without this each
# push spawns a parallel run that stays alive until it finishes naturally,
# burning runner minutes on superseded SHAs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN. This workflow only reads the repo — no
# comments, no releases, no packages. Fork PR runs get this same scope.
permissions:
  contents: read

jobs:
  shell:
    name: ${{ matrix.os }} (${{ matrix.mode }}, shard ${{ matrix.shard }}/${{ matrix.total }})
    strategy:
      fail-fast: false
      matrix:
        # PR macOS: 56 entries, 5,159 weighted test seconds / 60 + 2 jobs * 2m setup
        # = 89.98 runner-minutes (two ~45m jobs). Other events keep all 6 shards.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[
            { "os": "ubuntu-latest", "mode": "full", "shard": 1, "total": 4 },
            { "os": "ubuntu-latest", "mode": "full", "shard": 2, "total": 4 },
            { "os": "ubuntu-latest", "mode": "full", "shard": 3, "total": 4 },
            { "os": "ubuntu-latest", "mode": "full", "shard": 4, "total": 4 },
            { "os": "macos-latest", "mode": "focused", "shard": 1, "total": 2 },
            { "os": "macos-latest", "mode": "focused", "shard": 2, "total": 2 }
          ]' || '[
            { "os": "ubuntu-latest", "mode": "full", "shard": 1, "total": 4 },
            { "os": "ubuntu-latest", "mode": "full", "shard": 2, "total": 4 },
            { "os": "ubuntu-latest", "mode": "full", "shard": 3, "total": 4 },
            { "os": "ubuntu-latest", "mode": "full", "shard": 4, "total": 4 },
            { "os": "macos-latest", "mode": "full", "shard": 1, "total": 6 },
            { "os": "macos-latest", "mode": "full", "shard": 2, "total": 6 },
            { "os": "macos-latest", "mode": "full", "shard": 3, "total": 6 },
            { "os": "macos-latest", "mode": "full", "shard": 4, "total": 6 },
            { "os": "macos-latest", "mode": "full", "shard": 5, "total": 6 },
            { "os": "macos-latest", "mode": "full", "shard": 6, "total": 6 }
          ]') }}
    runs-on: ${{ matrix.os }}
    env:
      BUREAU_REQUIRE_LOCAL_SERVER: '1'
      BUREAU_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
      BUREAU_TEST_MANIFEST: ${{ matrix.mode == 'focused' && 'tests/macos-manifest.txt' || '' }}
      BUREAU_TEST_TIMINGS: ${{ github.workspace }}/test-timings.tsv
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # pinned by SHA per supply-chain hygiene; Dependabot will open bump PRs

      # test_app_local_server.sh creates a real venv. Refreshed weights can move
      # it between Linux shards, so each Linux shard keeps python3-venv.
      - name: Install Python venv support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-venv

      - name: Install lint tooling
        if: matrix.shard == 1
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y --no-install-recommends shellcheck
          else
            command -v shellcheck >/dev/null || brew install shellcheck
          fi

      - name: Show test tool versions
        run: |
          /bin/bash --version
          python3 --version
          node --version

      - name: Bash syntax check
        if: matrix.shard == 1
        run: |
          for f in templates/scripts/*.sh tests/run.sh tests/lib/*.sh tests/test_*.sh; do
            [ -f "$f" ] || continue
            /bin/bash -n "$f"
          done

      - name: shellcheck pipeline scripts
        if: matrix.shard == 1
        # Severity bumped to `warning` — info/style notes (SC2001 sed→parameter
        # expansion, SC2015 A&&B||C, SC2016 jq variables in single quotes) are
        # mostly false positives for our patterns. Real correctness issues
        # (warning/error) still fail the build.
        #
        # SC1091 (sourced files not followed) — sources are resolved at
        # runtime via $(dirname "$0"), shellcheck can't see them statically.
        # SC2034 (unused vars) — bureau-config.sh defines BUREAU_* that
        # downstream scripts consume via word-of-mouth.
        # SC2155 (declare-and-assign) — common pattern in bureau-config.
        # SC2086 (unquoted expansion) — intentional for $CLAUDE word-split.
        run: |
          shellcheck -S warning -e SC1091,SC2034,SC2155,SC2086 \
            templates/scripts/bureau-config.sh \
            templates/scripts/implement-pipeline.sh \
            templates/scripts/qa-pipeline.sh \
            templates/scripts/code-review-pipeline.sh

      - name: Run test harness
        run: PATH="/bin:$PATH" /bin/bash tests/run.sh

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timings-${{ matrix.os }}-${{ matrix.shard }}-of-${{ matrix.total }}
          path: ${{ env.BUREAU_TEST_TIMINGS }}
